# Run the site with Docker Compose:
#   docker compose -f deploy/compose.yaml --env-file .env up -d --build
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    # ~600 MB RSS measured with a ~70k-chunk keyword index in memory;
    # raise/lower to fit your corpus.
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz').status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
